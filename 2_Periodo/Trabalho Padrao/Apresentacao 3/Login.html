<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelMon</title>
    <link rel="stylesheet" href="./CSS/Login.css">
</head>
<body>
    <header class="Inicio">
        <div class="margem_pixel">
            <img src="./CSS/Imagems_Extras/Titulo.png" id="Titulo" >
            <img src="./CSS/Imagems_Extras/Botao_Home_0.png" id="B_Home">
            <img src="./CSS/Imagems_Extras/Botao_Deck_0.png" id="B_Deck">
            <img src="./CSS/Imagems_Extras/Botao_Login_0.png" id="B_Login">
        </div>
    </header>
    <section class="Area_Login">
        <h1 class="Titulo_Login">LOGIN</h1>
        <div class="Campos_Login">
            <input type="email" placeholder="E-mail">
            <input type="password" placeholder="Senha">
            <button>Entrar</button>        
        </div>
        <a href="" class="CriarContaText">Nao Tem Conta? Criar Conta.</a>
    </section>
    <script type="module" src="main.js"></script>
</body>
</html>
